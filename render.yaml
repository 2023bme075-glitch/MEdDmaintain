services:
  - type: web
    name: medmaintain
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medmaintain-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTEBOOK_API_KEY
        generateValue: true
databases:
  - name: medmaintain-db
    plan: basic-256mb
