{% extends "base.html" %}{% block content %}<section class="section formsection"><p class="eyebrow">NEW SUBMISSION</p><h1>{{ tr("Equipment maintenance entry") }}</h1><p class="lead">Record the equipment identity, location, service and current condition.</p><form method="post" class="entryform">
<h3>01 · Equipment identification</h3><div class="formgrid"><label>{{ tr("Serial number") }} *<input name="serial_number" required></label><label>{{ tr("Model number") }} *<input name="model_number" required></label><label>{{ tr("Manufacturer") }}<input name="manufacturer"></label></div>
<h3>02 · Location</h3><div class="formgrid"><label>{{ tr("Current location") }}<input name="current_location" placeholder="Ward, department or room"></label><label>{{ tr("Past locations") }}<input name="past_locations" placeholder="Previous departments or locations"></label></div>
<h3>03 · Maintenance activity</h3><div class="formgrid"><label>{{ tr("Service date") }}<input name="service_date" type="date"></label><label>{{ tr("Service type") }}<select name="service_type"><option value="N/A">Not specified</option>{% for s in service_types %}<option>{{s}}</option>{% endfor %}</select></label><label>{{ tr("Status") }}<select name="status">{% for s in statuses %}<option>{{s}}</option>{% endfor %}</select></label></div>
<label>Issues, work performed and recommendations<textarea name="issues" rows="4" placeholder="Fault reported, inspection findings, parts replaced, next action…"></textarea></label><button class="button">{{ tr("Save maintenance entry") }} →</button></form></section>{% endblock %}
